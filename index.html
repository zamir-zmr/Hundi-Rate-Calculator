<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remittance Rate Comparison Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fc; --card:#ffffff; --border:#e6ebf4; --text:#0f172a; --muted:#64748b;
  --blue:#2563eb; --blue-soft:#eaf1ff; --blue-glow:rgba(37,99,235,.18);
  --hundi:#f59e0b; --hundi-soft:#fff6e0; --bank:#10b981; --bank-soft:#e5f8f1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -8px rgba(15,23,42,.10);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
body::before{background:#bfd6ff;top:-140px;left:-120px}
body::after{background:#d6f5ea;bottom:-160px;right:-120px;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}

.app{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
.reveal{opacity:0;transform:translateY(22px);animation:reveal .7s cubic-bezier(.16,1,.3,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.45s}
@keyframes reveal{to{opacity:1;transform:none}}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px rgba(37,99,235,.55);animation:logoPop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes logoPop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
.logo svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
.brand p{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.reset{border:1px solid var(--border);background:#fff;color:var(--muted);width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:.25s}
.reset:hover{color:var(--blue);border-color:#c7d8fb;transform:rotate(-90deg)}
.reset:active{transform:rotate(-180deg) scale(.92)}
.reset svg{width:18px;height:18px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.section-title{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field.full{grid-column:1/-1}
label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#94a3b8;pointer-events:none;transition:color .25s}
input{width:100%;background:#f8fafd;border:1.5px solid var(--border);border-radius:14px;padding:14px 46px 14px 14px;font-size:17px;font-weight:700;color:var(--text);outline:none;transition:all .25s cubic-bezier(.4,0,.2,1)}
input::placeholder{color:#b6c0d0;font-weight:600}
input:hover{border-color:#cfd9ea}
input:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow)}
.input-wrap:focus-within .unit{color:var(--blue)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* Results */
.results{display:flex;flex-direction:column;gap:12px}
.res{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.res:hover{transform:translateY(-2px)}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:18px;font-weight:800}
.res.hundi .icon{background:var(--hundi-soft);color:var(--hundi)}
.res.bank .icon{background:var(--bank-soft);color:var(--bank)}
.info{flex:1;min-width:0}
.info .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info .s{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.val{font-size:20px;font-weight:800;letter-spacing:-.4px;text-align:right;font-variant-numeric:tabular-nums}
.val small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}

.badge{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--blue);color:#fff;display:none}
.res.winner{border-color:#b9cffa;box-shadow:0 0 0 3px var(--blue-glow),var(--shadow)}
.res.winner .badge{display:inline-block;animation:badgePop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgePop{from{transform:scale(0);opacity:0}}

/* Comparison bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.track{height:10px;border-radius:99px;background:#eef2f8;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.16,1,.3,1)}
.fill.h{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.fill.b{background:linear-gradient(90deg,#34d399,#10b981)}

/* Benefit */
.benefit{border-radius:22px;padding:22px;color:#fff;background:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);box-shadow:0 18px 40px -12px rgba(37,99,235,.55);position:relative;overflow:hidden;transition:background .5s}
.benefit::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;right:-70px;animation:float 9s ease-in-out infinite}
.benefit::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.benefit.hundi-win{background:linear-gradient(135deg,#fbbf24 0%,#d97706 100%);box-shadow:0 18px 40px -12px rgba(217,119,6,.5)}
.benefit.bank-win{background:linear-gradient(135deg,#34d399 0%,#059669 100%);box-shadow:0 18px 40px -12px rgba(5,150,105,.5)}
.benefit>*{position:relative;z-index:1}
.b-label{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.9}
.b-main{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.b-sub{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.pulse{animation:pulse .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pulse{50%{transform:scale(1.05)}}

.foot{text-align:center;font-size:11px;color:#94a3b8;font-weight:500;padding-bottom:8px}

@media(max-width:380px){.grid{grid-template-columns:1fr}.b-main{font-size:28px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">

  <div class="header reveal d1">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
      </div>
      <div>
        <h1>Rate Calculator</h1>
        <p>Remittance &amp; Benefit Tracker</p>
      </div>
    </div>
    <button class="reset" onclick="resetAll()" title="Reset" aria-label="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="card reveal d2">
    <div class="section-title">Inputs</div>
    <div class="grid">
      <div class="field">
        <label for="rial">Rial Amount</label>
        <div class="input-wrap"><input type="number" id="rial" placeholder="0.00" inputmode="decimal" oninput="calculate()"><span class="unit">OMR</span></div>
      </div>
      <div class="field">
        <label for="bankCharge">Bank Charge</label>
        <div class="input-wrap"><input type="number" id="bankCharge" placeholder="2.1" inputmode="decimal" oninput="calculate()"><span class="unit">OMR</span></div>
      </div>
      <div class="field">
        <label for="hundiRate">Hundi Rate</label>
        <div class="input-wrap"><input type="number" id="hundiRate" placeholder="Rate" inputmode="decimal" oninput="calculate()"><span class="unit">INR</span></div>
      </div>
      <div class="field">
        <label for="bankRate">Bank Rate</label>
        <div class="input-wrap"><input type="number" id="bankRate" placeholder="Rate" inputmode="decimal" oninput="calculate()"><span class="unit">INR</span></div>
      </div>
    </div>
  </div>

  <div class="results reveal d3">
    <div class="res hundi" id="hundiCard">
      <div class="icon">H</div>
      <div class="info">
        <div class="t">Hundi Total <span class="badge">Best</span></div>
        <div class="s">Amount received in INR</div>
      </div>
      <div class="val"><span id="hundiResult">0.00</span></div>
    </div>
    <div class="res bank" id="bankCard">
      <div class="icon">B</div>
      <div class="info">
        <div class="t">Bank Total <span class="badge">Best</span></div>
        <div class="s">After bank charge, in INR</div>
      </div>
      <div class="val"><span id="bankResult">0.00</span></div>
    </div>
  </div>

  <div class="card reveal d4">
    <div class="section-title">Comparison</div>
    <div class="bars">
      <div class="bar-row">
        <div class="bar-top"><span>Hundi</span><span id="hundiPct">0%</span></div>
        <div class="track"><div class="fill h" id="hundiBar"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-top"><span>Bank</span><span id="bankPct">0%</span></div>
        <div class="track"><div class="fill b" id="bankBar"></div></div>
      </div>
    </div>
  </div>

  <div class="benefit reveal d5" id="benefitCard">
    <div class="b-label" id="benefitLabel">Benefit Difference</div>
    <div class="b-main" id="benefitResult">0.00 INR</div>
    <div class="b-sub" id="benefitOmrResult">0.000 OMR</div>
  </div>

  <div class="foot">Your inputs are saved automatically on this device</div>
</div>

<script>
const $ = id => document.getElementById(id);
const fields = ['rial','bankCharge','hundiRate','bankRate'];
const fmt = n => n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* Smooth count-up */
const current = {};
function animateNumber(el, to, formatter){
  const from = current[el.id] || 0;
  if (from === to){ el.textContent = formatter(to); return; }
  cancelAnimationFrame(el._raf);
  const start = performance.now(), dur = 600;
  (function step(now){
    const p = Math.min((now - start)/dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = formatter(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
    else current[el.id] = to;
  })(start);
  current[el.id] = to;
}

function pulse(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

window.onload = function(){
  fields.forEach(id => { const v = store.get(id); if (v) $(id).value = v; });
  calculate();
};

function resetAll(){
  fields.forEach(id => { $(id).value = ''; store.set(id,''); });
  calculate();
}

function calculate(){
  fields.forEach(id => store.set(id, $(id).value));

  const rial = parseFloat($('rial').value) || 0;
  const bankCharge = parseFloat($('bankCharge').value) || 0;
  const hundiRate = parseFloat($('hundiRate').value) || 0;
  const bankRate = parseFloat($('bankRate').value) || 0;

  const hundiTotal = rial * hundiRate;
  const bankTotal = Math.max(0, rial - bankCharge) * bankRate;

  animateNumber($('hundiResult'), hundiTotal, fmt);
  animateNumber($('bankResult'), bankTotal, fmt);

  /* Bars */
  const max = Math.max(hundiTotal, bankTotal);
  const hp = max > 0 ? (hundiTotal / max) * 100 : 0;
  const bp = max > 0 ? (bankTotal / max) * 100 : 0;
  $('hundiBar').style.width = hp + '%';
  $('bankBar').style.width = bp + '%';
  $('hundiPct').textContent = Math.round(hp) + '%';
  $('bankPct').textContent = Math.round(bp) + '%';

  /* Winner state */
  $('hundiCard').classList.toggle('winner', hundiTotal > bankTotal);
  $('bankCard').classList.toggle('winner', bankTotal > hundiTotal);

  const card = $('benefitCard');
  card.classList.remove('hundi-win','bank-win');

  if (hundiTotal > 0 || bankTotal > 0){
    const diffInr = Math.abs(hundiTotal - bankTotal);
    const diffOmr = bankRate > 0 ? diffInr / bankRate : 0;

    animateNumber($('benefitResult'), diffInr, n => fmt(n) + ' INR');
    animateNumber($('benefitOmrResult'), diffOmr, n => n.toFixed(3) + ' OMR');

    if (hundiTotal > bankTotal){ $('benefitLabel').textContent = 'Hundi Rate Benefit'; card.classList.add('hundi-win'); }
    else if (bankTotal > hundiTotal){ $('benefitLabel').textContent = 'Bank Rate Benefit'; card.classList.add('bank-win'); }
    else { $('benefitLabel').textContent = 'Equal Rates'; }
  } else {
    animateNumber($('benefitResult'), 0, n => fmt(n) + ' INR');
    animateNumber($('benefitOmrResult'), 0, n => n.toFixed(3) + ' OMR');
    $('benefitLabel').textContent = 'Benefit Difference';
  }

  pulse($('benefitResult'));
  pulse($('benefitOmrResult'));
}
</script>
</body>
</html>
